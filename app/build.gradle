plugins {
    id 'com.android.application'
}

android {
    namespace 'com.decod.grm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.decod.grm'
        minSdk 33
        targetSdk 35
        versionCode 220001
        versionName '22.0.0-mobile.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
}
