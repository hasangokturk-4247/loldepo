plugins {
    id 'com.android.application'
}

android {
    namespace 'com.decod.gservice'
    compileSdk 35

    defaultConfig {
        applicationId "com.decod.gservice"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}

// G-Service 1.0.3 build trigger
