name: Build LOL Encyclopedia

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow reportlab
      - name: Build PDF
        run: python build.py
      - name: Verify PDF
        run: |
          test -s output/LOL_Ansiklopedi_Riot_2026.pdf
          pdfinfo output/LOL_Ansiklopedi_Riot_2026.pdf
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: LOL_Ansiklopedi_Riot_2026
          path: output/LOL_Ansiklopedi_Riot_2026.pdf
          retention-days: 7
          compression-level: 0
