name: G-Rm Android Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct Android project
        run: |
          set -euxo pipefail
          cat grm-final/r00 grm-final/r01 grm-final/r02 grm-final/r03 grm-final/r04 grm-final/r05 grm-final/r06 grm-final/r07 grm-final/p01 grm-final/p02 grm-final/p03 grm-final/p04 > /tmp/grm.tar.xz
          test "$(sha256sum /tmp/grm.tar.xz | awk '{print $1}')" = "f4d3b1143362aa34d32083298523b2fb945c8cd682c697a7460ee5cf0a129efb"
          rm -rf app build.gradle settings.gradle gradle.properties README.md
          tar -xJf /tmp/grm.tar.xz
          rm -f app/src/main/res/drawable/icon.xml
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' app/src/main/java/com/decod/grm/MainActivity.java
      - name: Show GCM call sites
        run: |
          grep -R -n -C 3 -E 'GCMParameterSpec|Cipher\.ENCRYPT_MODE|AndroidKeyStore' app/src/main/java || true
          exit 1
