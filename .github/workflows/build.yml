name: G-Rm Android Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct Android project
        run: |
          set -euxo pipefail
          cat grm-final/p00 grm-final/p01 grm-final/p02 grm-final/p03 grm-final/p04 > /tmp/grm.tar.xz
          rm -rf app build.gradle settings.gradle gradle.properties README.md
          tar -xJf /tmp/grm.tar.xz
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk G-Rm_Android_v22.0.1_QR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G-Rm_Android_v22.0.1_QR
          path: G-Rm_Android_v22.0.1_QR.apk
          retention-days: 7
          compression-level: 0
