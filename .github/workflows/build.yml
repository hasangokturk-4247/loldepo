name: G-Rm Android Build
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct and patch Android project
        shell: bash
        run: |
          set -euxo pipefail
          cat grm-final/r00 grm-final/r01 grm-final/r02 grm-final/r03 grm-final/r04 grm-final/r05 grm-final/r06 grm-final/r07 grm-final/p01 grm-final/p02 grm-final/p03 grm-final/p04 > /tmp/grm.tar.xz
          rm -rf app build.gradle settings.gradle gradle.properties README.md
          tar -xJf /tmp/grm.tar.xz
          rm -f app/src/main/res/drawable/icon.xml
          sed -i 's/import android.app.PrintManager;/import android.print.PrintManager;/' app/src/main/java/com/decod/grm/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/decod/grm/SecureStateStore.java')
          s=p.read_text()
          pat=r'\s*byte\[\] iv = new byte\[12\];\s*CryptoUtil\.RNG\.nextBytes\(iv\);\s*Cipher cipher = Cipher\.getInstance\("AES/GCM/NoPadding"\);\s*cipher\.init\(Cipher\.ENCRYPT_MODE, getOrCreateKey\(\), new GCMParameterSpec\(128, iv\)\);\s*byte\[\] ct = cipher\.doFinal\(plain\);'
          rep='''\n        Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
        cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey());
        byte[] iv = cipher.getIV();
        if (iv == null || iv.length != 12) throw new IllegalStateException("Android Keystore IV üretemedi");
        byte[] ct = cipher.doFinal(plain);'''
          s2,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('SecureStateStore regex patch target not found')
          p.write_text(s2)
          PY
          echo '[... ELLIPSIZATION ...]AAAAAElFTkSuQmCC' | base64 -d > app/src/main/res/drawable/icon.png
          cp app/src/main/res/drawable/icon.png app/src/main/assets/logo.png
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk G-Rm_Android_v22.0.2_QR_FIXED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G-Rm_Android_v22.0.2_QR_FIXED
          path: G-Rm_Android_v22.0.2_QR_FIXED.apk
          retention-days: 7
          compression-level: 0
