name: Build G-Service APK

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: gservice-android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle assembleDebug
      - name: Rename APK
        run: cp gservice-android/app/build/outputs/apk/debug/app-debug.apk G-Service-1.0.7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G-Service-1.0.7
          path: G-Service-1.0.7.apk
