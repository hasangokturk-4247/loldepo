name: GRM Offline Toolchain
on:
  push:
    branches: ['build-tools/grm-20261026']
    paths: ['.github/workflows/grm-offline-toolchain.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Prepare public dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grm-tools" "$RUNNER_TEMP/dummy/app/src/main"
          T="$RUNNER_TEMP/grm-tools"
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$T/gradle.zip"
          unzip -q "$T/gradle.zip" -d "$T"
          rm "$T/gradle.zip"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$T/sdk/platforms" "$T/sdk/build-tools"
          cp -a "$ANDROID_HOME/platforms/android-35" "$T/sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$T/sdk/build-tools/"
          cp -a "$ANDROID_HOME/licenses" "$T/sdk/"
          cd "$RUNNER_TEMP/dummy"
          printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name='DependencyCache'\ninclude ':app'\n" > settings.gradle
          printf "plugins { id 'com.android.application' version '8.7.3' apply false }\n" > build.gradle
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'org.example.cache'; compileSdk 35; defaultConfig { applicationId 'org.example.cache'; minSdk 26; targetSdk 35; versionCode 1; versionName '1' }; buildTypes { release { minifyEnabled false } }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          dependencies { implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'; implementation 'com.journeyapps:zxing-android-embedded:4.3.0' }
          EOF
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="DependencyCache" /></manifest>\n' > app/src/main/AndroidManifest.xml
          "$T/gradle-8.10.2/bin/gradle" --no-daemon :app:assembleRelease
          mkdir -p "$T/gradle-home"
          cp -a "$HOME/.gradle/caches" "$T/gradle-home/"
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$T/json.jar"
          mkdir -p "$T/native-go"
          cd "$T/native-go"
          go mod init grmnative
          go get github.com/jchv/go-webview2@latest
          printf 'package main\nimport webview "github.com/jchv/go-webview2"\nfunc main(){w:=webview.New(false); defer w.Destroy(); w.SetTitle("G-Rm"); w.Run()}\n' > main.go
          go mod tidy
          go mod vendor
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o native-test.exe .
          rm native-test.exe
          cd "$RUNNER_TEMP"
          tar -czf grm-public-toolchain.tgz grm-tools
          sha256sum grm-public-toolchain.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: grm-public-toolchain
          path: ${{ runner.temp }}/grm-public-toolchain.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
