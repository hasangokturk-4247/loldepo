pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}

def chunkDir = file("../gstudio-build/chunks")
def restDir = file("../gstudio-build/rest")
def parts = []
if (chunkDir.exists()) {
    parts.addAll(chunkDir.listFiles().findAll { it.name.endsWith(".txt") }.sort { it.name })
}
if (restDir.exists()) {
    parts.addAll(restDir.listFiles().findAll { it.name.endsWith(".txt") }.sort { it.name })
}
if (parts.isEmpty()) {
    throw new GradleException("G-Studio source chunks not found")
}

def encoded = parts.collect { it.getText("UTF-8").trim() }.join("")
def zipBytes = java.util.Base64.decoder.decode(encoded)
def zipFile = file("gstudio-source.zip")
zipFile.bytes = zipBytes

copy {
    from zipTree(zipFile)
    include "app/**"
    into rootDir
}

rootProject.name = "GStudioMobile"
include ":app"
